<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSC426</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f2f2f2; color: #111; }
  nav { background: #fff; border-bottom: 2px solid #111; display: flex; align-items: center; padding: 0 24px; }
  nav .brand { font-size: 14px; font-weight: bold; padding: 14px 0; margin-right: 30px; }
  nav a { text-decoration: none; color: #555; font-size: 14px; padding: 16px 14px; display: inline-block; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  nav a:hover { color: #111; }
  nav a.active { color: #111; font-weight: bold; border-bottom-color: #111; }
  .page { display: none; max-width: 380px; margin: 40px auto; background: #fff; border: 1px solid #ddd; padding: 28px; }
  .page.show { display: block; }
  .page h1 { font-size: 17px; margin-bottom: 22px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
  .disp { border: 1px solid #bbb; background: #fafafa; text-align: right; padding: 10px 14px; font-size: 26px; min-height: 50px; margin-bottom: 10px; word-break: break-all; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .b { padding: 13px; font-size: 15px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-family: Arial, sans-serif; }
  .b:hover { background: #f0f0f0; }
  .b.op { background: #f5f5f5; }
  .b.cl { background: #e5e5e5; }
  .b.eq { background: #111; color: #fff; grid-column: span 2; }
  .b.eq:hover { background: #333; }
  .fld { margin-bottom: 16px; }
  .fld label { display: block; font-size: 13px; margin-bottom: 5px; color: #444; }
  .fld input { width: 100%; padding: 9px 11px; border: 1px solid #ccc; font-size: 14px; font-family: Arial, sans-serif; }
  .fld input:focus { outline: 2px solid #111; border-color: transparent; }
  .ferr { font-size: 12px; color: #c00; margin-top: 4px; display: none; }
  .ferr.on { display: block; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  .row button { flex: 1; padding: 10px; font-size: 14px; cursor: pointer; border: 1px solid #111; font-family: Arial, sans-serif; }
  .sub { background: #111; color: #fff; }
  .sub:hover { background: #333; }
  .can { background: #fff; }
  .can:hover { background: #f0f0f0; }
  .alert { margin-top: 16px; padding: 10px 12px; font-size: 13px; border: 1px solid #bbb; display: none; }
  .alert.ok { background: #f8f8f8; }
  .alert.err { background: #fff8f8; color: #a00; border-color: #ddd; }
</style>
</head>
<body>
<nav>
  <div class="brand">CSC426</div>
  <a href="#calculator" class="active" onclick="nav('calculator')">Calculator</a>
  <a href="#login" onclick="nav('login')">Login</a>
</nav>

<div class="page show" id="page-calculator">
  <h1>Calculator</h1>
  <div class="disp" id="d8">0</div>
  <div class="grid">
    <button class="b cl" onclick="c8()">C</button>
    <button class="b op" onclick="o8('^')">^</button>
    <button class="b op" onclick="o8('%')">%</button>
    <button class="b op" onclick="o8('/')">&#247;</button>
    <button class="b" onclick="n8('7')">7</button>
    <button class="b" onclick="n8('8')">8</button>
    <button class="b" onclick="n8('9')">9</button>
    <button class="b op" onclick="o8('*')">&#215;</button>
    <button class="b" onclick="n8('4')">4</button>
    <button class="b" onclick="n8('5')">5</button>
    <button class="b" onclick="n8('6')">6</button>
    <button class="b op" onclick="o8('-')">-</button>
    <button class="b" onclick="n8('1')">1</button>
    <button class="b" onclick="n8('2')">2</button>
    <button class="b" onclick="n8('3')">3</button>
    <button class="b op" onclick="o8('+')">+</button>
    <button class="b" onclick="n8('0')">0</button>
    <button class="b" onclick="n8('.')">.</button>
    <button class="b eq" onclick="e8()">=</button>
  </div>
</div>

<div class="page" id="page-login">
  <h1>Login</h1>
  <div class="fld">
    <label>Username</label>
    <input type="text" id="u8" autocomplete="off" placeholder="Enter username">
    <div class="ferr" id="ue8">Username is required.</div>
  </div>
  <div class="fld">
    <label>Password</label>
    <input type="password" id="p8" placeholder="Enter password">
    <div class="ferr" id="pe8">Password must be at least 6 characters.</div>
  </div>
  <div class="row">
    <button class="sub" onclick="lg8()">Login</button>
    <button class="can" onclick="rs8()">Reset</button>
  </div>
  <div class="alert" id="al8"></div>
</div>

<script>
  function nav(page) {
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('show'); });
    document.querySelectorAll('nav a').forEach(function(a) { a.classList.remove('active'); });
    document.getElementById('page-' + page).classList.add('show');
    document.querySelector('nav a[href="#' + page + '"]').classList.add('active');
  }

  window.addEventListener('hashchange', function() {
    var h = location.hash.replace('#', '') || 'calculator';
    if (document.getElementById('page-' + h)) nav(h);
  });

  var ex8 = '', jc8 = false;
  function sd8(v) { document.getElementById('d8').textContent = v || '0'; }
  function n8(d) { if (jc8) { ex8 = ''; jc8 = false; } if (d==='.'&&ex8.split(/[+\-*/%^]/).pop().includes('.')) return; ex8+=d; sd8(ex8); }
  function o8(op) { jc8=false; if (!ex8&&op!=='-') return; if (ex8&&'+-*/%^'.includes(ex8.slice(-1))) ex8=ex8.slice(0,-1); ex8+=op; sd8(ex8); }
  function c8() { ex8=''; jc8=false; sd8('0'); }
  function e8() {
    if (!ex8) return;
    try {
      var r = Function('"use strict";return(' + ex8.replace(/\^/g,'**') + ')')();
      if (!isFinite(r)) { sd8('Error'); ex8=''; return; }
      r = parseFloat(r.toFixed(10)); ex8=String(r); sd8(ex8); jc8=true;
    } catch(e) { sd8('Error'); ex8=''; }
  }

  function lg8() {
    var u=document.getElementById('u8').value.trim(), p=document.getElementById('p8').value;
    var ue=document.getElementById('ue8'), pe=document.getElementById('pe8'), al=document.getElementById('al8');
    ue.className='ferr'; pe.className='ferr'; al.style.display='none';
    var ok=true;
    if (!u) { ue.className='ferr on'; ok=false; }
    if (p.length<6) { pe.className='ferr on'; ok=false; }
    if (!ok) return;
    al.style.display='block';
    if (u==='admin'&&p==='admin123') { al.className='alert ok'; al.textContent='Login successful. Welcome, '+u+'.'; }
    else { al.className='alert err'; al.textContent='Incorrect username or password.'; }
  }

  function rs8() {
    document.getElementById('u8').value=''; document.getElementById('p8').value='';
    document.getElementById('ue8').className='ferr'; document.getElementById('pe8').className='ferr';
    var al=document.getElementById('al8'); al.style.display='none'; al.className='alert';
  }
</script>
</body>
</html>
